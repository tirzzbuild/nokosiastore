<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beli Nomor - Nokosia Store</title>
  <meta name="theme-color" content="#0b0b12">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span>Nokosia</span>
    </a>
    <div class="balance-pill" id="balancePill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg>
      <span id="userBalance">0</span>
    </div>
  </div>
</header>

<main class="container page">
  <div id="loginNeeded" class="card text-center hidden">
    <p class="mb-3">Silakan login untuk membeli nomor.</p>
    <a href="login.html" class="btn btn-primary">Login dengan GitHub</a>
  </div>

  <div id="buyContent">
    <div class="card">
      <div class="card-title">Pilih Layanan</div>
      <div class="form-group">
        <input type="text" id="searchService" class="form-control" placeholder="Cari layanan... (WhatsApp, Telegram, dll)">
      </div>
      <div id="serviceList" style="max-height:280px;overflow-y:auto">
        <div class="text-center text-muted" style="padding:20px"><div class="spinner" style="margin:0 auto"></div></div>
      </div>
    </div>

    <div class="card hidden" id="countryCard">
      <div class="card-title">Pilih Negara</div>
      <div id="countryList"></div>
    </div>

    <div class="card hidden" id="productCard">
      <div class="card-title">Server & Harga</div>
      <div id="productList"></div>
    </div>

    <div class="card hidden" id="orderCard">
      <div class="card-title">Konfirmasi Order</div>
      <div id="orderSummary"></div>
      <button id="btnOrder" class="btn btn-primary btn-block mt-3">Beli Nomor</button>
    </div>

    <div class="card hidden" id="resultCard">
      <div class="card-title">Nomor & OTP</div>
      <div id="resultContent"></div>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>Beranda</span>
  </a>
  <a href="deposit.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
    <span>Deposit</span>
  </a>
  <a href="beli.html" class="nav-item center">
    <div class="center-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/><path d="M9 6h6"/></svg>
    </div>
    <span>Beli</span>
  </a>
  <a href="pesanan.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
    <span>Pesanan</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
</nav>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
let selected = { service: null, country: null, product: null };
let currentUser = null;
let pollInterval = null;

(async () => {
  currentUser = await getCurrentUser();
  if (!currentUser) {
    document.getElementById('loginNeeded').classList.remove('hidden');
    document.getElementById('buyContent').classList.add('hidden');
    return;
  }
  document.getElementById('userBalance').textContent = Number(currentUser.balance||0).toLocaleString('id-ID');
  loadServices();
})();

async function loadServices() {
  try {
    const res = await wnRequest('GET', '/smscode/services');
    const list = res.data || res || [];
    const el = document.getElementById('serviceList');
    el.innerHTML = '';
    list.forEach(s => {
      const id = s.id || s.service_code || s.code;
      const name = s.name || s.service_name || 'Service';
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `<div class="icon-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
        <div class="info"><div class="name">${name}</div></div>`;
      div.onclick = () => selectService(id, name, div);
      el.appendChild(div);
    });
  } catch (e) {
    document.getElementById('serviceList').innerHTML = '<p class="text-center text-muted">Gagal memuat layanan</p>';
  }
}

// Search
document.getElementById('searchService')?.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#serviceList .list-item').forEach(item => {
    const name = item.querySelector('.name')?.textContent.toLowerCase() || '';
    item.style.display = name.includes(q) ? '' : 'none';
  });
});

function selectService(id, name, el) {
  document.querySelectorAll('#serviceList .list-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  selected.service = { id, name };
  selected.country = null;
  selected.product = null;
  document.getElementById('countryCard').classList.remove('hidden');
  document.getElementById('productCard').classList.add('hidden');
  document.getElementById('orderCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  loadCountries();
}

async function loadCountries() {
  const res = await wnRequest('GET', '/smscode/countries');
  const list = res.data || res || [];
  const el = document.getElementById('countryList');
  el.innerHTML = '';
  list.forEach(c => {
    const id = c.id || c.country_id;
    const name = c.name || c.country_name || 'Country';
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg></div>
      <div class="info"><div class="name">${name}</div></div>`;
    div.onclick = () => selectCountry(id, name, div);
    el.appendChild(div);
  });
}

function selectCountry(id, name, el) {
  document.querySelectorAll('#countryList .list-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  selected.country = { id, name };
  selected.product = null;
  document.getElementById('productCard').classList.remove('hidden');
  document.getElementById('orderCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  loadProducts();
}

async function loadProducts() {
  const res = await wnRequest('GET', `/smscode/products?platform_id=${selected.service.id}&country_id=${selected.country.id}`);
  const list = res.data || [];
  const el = document.getElementById('productList');
  el.innerHTML = '';
  if (!list.length) {
    el.innerHTML = '<p class="text-center text-muted">Tidak ada server tersedia</p>';
    return;
  }
  list.forEach(p => {
    const price = (parseInt(p.price) || 0) + CONFIG.PRICE_MARKUP;
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="icon-box">📱</div>
      <div class="info">
        <div class="name">${p.name || p.server_name || 'Server'}</div>
        <div class="meta">Stok: ${p.stock ?? '-'}</div>
      </div>
      <div class="price">${formatRp(price)}</div>`;
    div.onclick = () => selectProduct(p, price, div);
    el.appendChild(div);
  });
}

function selectProduct(p, price, el) {
  document.querySelectorAll('#productList .list-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  selected.product = { ...p, finalPrice: price };
  document.getElementById('orderCard').classList.remove('hidden');
  document.getElementById('orderSummary').innerHTML = `
    <p><strong>${selected.service.name}</strong> · ${selected.country.name}</p>
    <p class="text-muted" style="font-size:0.9rem;margin-top:4px">${p.name || 'Server'}</p>
    <p style="font-size:1.3rem;font-weight:700;color:var(--purple-neon);margin-top:12px">${formatRp(price)}</p>
    <p class="text-muted" style="font-size:0.8rem">Saldo kamu: ${formatRp(currentUser.balance)}</p>`;
}

document.getElementById('btnOrder').onclick = async () => {
  if (!selected.product) return;
  const price = selected.product.finalPrice;

  if (currentUser.balance < price) {
    toast('Saldo tidak cukup. Silakan deposit dulu.');
    return;
  }

  const btn = document.getElementById('btnOrder');
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  try {
    // 1. Order ke provider
    const r = await wnRequest('POST', '/smscode/order', {
      product_id: selected.product.id || selected.product.product_id,
      app_id: selected.service.id,
      country_id: selected.country.id,
      service_name: selected.service.name
    });

    if (!(r.success || r.data?.trxId || r.trxId)) {
      toast(r.message || 'Gagal order');
      btn.disabled = false;
      btn.textContent = 'Beli Nomor';
      return;
    }

    const trxId = r.data?.trxId || r.trxId || ('WN' + Date.now());
    const phone = r.data?.phone || r.phone || null;

    // 2. Potong saldo + simpan order di Supabase
    const newBalance = currentUser.balance - price;
    await sb.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);

    await sb.from('orders').insert({
      user_id: currentUser.id,
      trx_id: trxId,
      product_id: selected.product.id || selected.product.product_id,
      app_id: selected.service.id,
      country_id: selected.country.id,
      service_name: selected.service.name,
      phone_number: phone,
      status: 'pending',
      price: price
    });

    currentUser.balance = newBalance;
    document.getElementById('userBalance').textContent = newBalance.toLocaleString('id-ID');

    // Tampilkan hasil
    document.getElementById('orderCard').classList.add('hidden');
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('resultContent').innerHTML = `
      <p class="text-muted" style="font-size:0.85rem">Nomor kamu:</p>
      <div class="otp-box" style="font-size:1.3rem;letter-spacing:2px">${phone || 'Menunggu...'}</div>
      <p class="text-muted mt-2" style="font-size:0.85rem">Menunggu OTP...</p>
      <div id="otpArea" class="otp-box hidden"></div>
      <button class="btn btn-ghost btn-block mt-3" onclick="cancelOrder('${trxId}')">Batalkan</button>`;

    // Poll status
    startPolling(trxId);
    toast('Order berhasil!');
  } catch (e) {
    toast('Terjadi kesalahan');
    console.error(e);
  }
  btn.disabled = false;
  btn.textContent = 'Beli Nomor';
};

function startPolling(trxId) {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const r = await wnRequest('GET', '/smscode/status/' + encodeURIComponent(trxId));
      const otp = r.data?.otp || r.otp;
      if (otp) {
        clearInterval(pollInterval);
        document.getElementById('otpArea').classList.remove('hidden');
        document.getElementById('otpArea').textContent = otp;
        // Update di Supabase
        await sb.from('orders').update({ otp_code: otp, status: 'success' }).eq('trx_id', trxId);
        toast('OTP diterima!');
      }
    } catch (e) {}
  }, 4000);
}

async function cancelOrder(trxId) {
  if (!confirm('Yakin batalkan order?')) return;
  try {
    await wnRequest('POST', '/smscode/cancel', { trxId });
    // Refund
    const { data: ord } = await sb.from('orders').select('price,status').eq('trx_id', trxId).eq('user_id', currentUser.id).single();
    if (ord && ord.status !== 'cancelled' && ord.status !== 'success') {
      const newBal = currentUser.balance + ord.price;
      await sb.from('profiles').update({ balance: newBal }).eq('id', currentUser.id);
      await sb.from('orders').update({ status: 'cancelled' }).eq('trx_id', trxId);
      currentUser.balance = newBal;
      document.getElementById('userBalance').textContent = newBal.toLocaleString('id-ID');
      toast('Order dibatalkan, saldo dikembalikan');
    }
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('resultCard').classList.add('hidden');
  } catch (e) {
    toast('Gagal membatalkan');
  }
}
</script>
</body>
</html>
