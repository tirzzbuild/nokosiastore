<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - Nokosia Store</title>
  <meta name="theme-color" content="#0b0b12">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="brand">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span>Nokosia</span>
    </a>
  </div>
</header>

<main class="container page">
  <div class="card text-center" style="margin-top:40px">
    <div class="brand-logo" style="width:64px;height:64px;margin:0 auto 16px;border-radius:16px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <h1 style="font-size:1.4rem;margin-bottom:8px">Masuk ke Nokosia</h1>
    <p class="text-muted mb-4" style="font-size:0.9rem">Login aman dengan akun GitHub. Saldo & data terlindungi.</p>
    
    <button onclick="loginWithGitHub()" class="btn btn-primary btn-block" style="gap:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.606-2.665-.304-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.236-3.22-.124-.303-.536-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.29-1.552 3.297-1.23 3.297-1.23.655 1.653.243 2.873.12 3.176.77.84 1.235 1.91 1.235 3.22 0 4.61-2.807 5.624-5.48 5.92.43.37.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .32.217.694.825.576C20.565 21.796 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      Lanjutkan dengan GitHub
    </button>
    
    <p class="text-muted mt-4" style="font-size:0.75rem">Dengan masuk, kamu menyetujui syarat layanan Nokosia Store.</p>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // Kalau sudah login, langsung ke index
  (async () => {
    const user = await getCurrentUser();
    if (user) location.href = 'index.html';

    // Simpan referral code dari URL
    const params = new URLSearchParams(location.search);
    const ref = params.get('ref');
    if (ref) localStorage.setItem('ref_code', ref);
  })();
</script>
</body>
</html>
